<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080a12">
  <title>iFlow Scanner</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{background:#080a12;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column}

    .hdr{background:rgba(0,0,0,.6);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,50,50,.15);flex-shrink:0;min-height:48px}
    .hdr-l{display:flex;align-items:center;gap:9px}
    .dot{width:9px;height:9px;border-radius:50%;background:#444;flex-shrink:0;transition:background .3s,box-shadow .3s}
    .dot.wait{background:#f59e0b;box-shadow:0 0 7px #f59e0b;animation:pulse 1s ease-in-out infinite}
    .dot.ok{background:#22c55e;box-shadow:0 0 7px #22c55e;animation:pulse 2s ease-in-out infinite}
    .dot.err{background:#ef4444;box-shadow:0 0 7px #ef4444}
    #sTxt{font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#555;transition:color .3s}
    .brand{font-size:.7rem;color:#333;font-weight:700;letter-spacing:.5px}

    .main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}

    /* ─ Cards ─ */
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px}
    .card-ttl{font-size:.85rem;font-weight:700;color:#4f8ef7;margin-bottom:10px}
    .card-hint{font-size:.73rem;color:#555;line-height:1.65;margin-bottom:12px}
    label{display:block;font-size:.73rem;font-weight:600;color:#666;margin-bottom:5px}
    input[type=text]{width:100%;padding:11px 13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;color:#fff;font-size:1rem;font-family:monospace;letter-spacing:1px;outline:none;-webkit-appearance:none}
    input[type=text]:focus{border-color:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,.15)}
    .err-msg{display:none;padding:9px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;font-size:.75rem;color:#f87171;line-height:1.5;margin-top:10px}
    .err-msg.show{display:block}

    /* Mode buttons */
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .mb{padding:11px 6px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);border-radius:11px;color:#666;font-size:.76rem;font-weight:600;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;-webkit-appearance:none}
    .mb .ic{font-size:1.25rem}
    .mb.on{background:rgba(79,142,247,.14);border-color:#4f8ef7;color:#4f8ef7}
    .mb.full{grid-column:1/-1}

    /* Buttons */
    .btn-main{width:100%;padding:14px;background:linear-gradient(135deg,#4f8ef7,#3668d0);color:#fff;border:none;border-radius:13px;font-size:.92rem;font-weight:700;cursor:pointer;letter-spacing:.3px;position:relative;overflow:hidden}
    .btn-main:disabled{opacity:.4;cursor:not-allowed}
    .btn-spinner{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:inherit}
    .btn-spinner.show{display:flex}
    .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    .btn-disc{width:100%;padding:11px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:11px;font-size:.82rem;font-weight:600;cursor:pointer}
    .btn-retry{padding:8px 16px;background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.35);color:#4f8ef7;border-radius:9px;font-size:.78rem;font-weight:600;cursor:pointer;margin-top:8px}

    /* Scanner screen */
    #scanScr{display:none;flex-direction:column;gap:11px;height:calc(100vh - 48px);overflow:hidden;padding:12px}
    #scanScr.on{display:flex}
    .mode-strip{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .mbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:16px;font-size:.71rem;font-weight:700;text-transform:uppercase}
    .mbadge.imei{background:rgba(79,142,247,.18);border:1px solid rgba(79,142,247,.35);color:#4f8ef7}
    .mbadge.integ{background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.28);color:#f87171}
    .mbadge.look{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);color:#4ade80}
    .peer-lbl{font-size:.65rem;color:#333;font-family:monospace}
    .peer-lbl span{color:#4f8ef7}

    .vid-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;flex-shrink:0}
    video{width:100%;max-height:46vmax;object-fit:cover;display:block}
    .v-ov{position:absolute;inset:0;pointer-events:none}
    .sln{position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(transparent,rgba(255,50,50,.9),transparent);animation:sln 2s ease-in-out infinite}
    .sfr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76%;height:68px;border:2px solid rgba(255,50,50,.8);border-radius:7px;box-shadow:0 0 0 2000px rgba(0,0,0,.3)}
    .c{position:absolute;width:12px;height:12px}
    .c.tl{top:-2px;left:-2px;border-top:3px solid #ff3333;border-left:3px solid #ff3333}
    .c.tr{top:-2px;right:-2px;border-top:3px solid #ff3333;border-right:3px solid #ff3333}
    .c.bl{bottom:-2px;left:-2px;border-bottom:3px solid #ff3333;border-left:3px solid #ff3333}
    .c.br{bottom:-2px;right:-2px;border-bottom:3px solid #ff3333;border-right:3px solid #ff3333}
    .flash{position:absolute;inset:0;background:rgba(50,255,50,.4);opacity:0;pointer-events:none;border-radius:14px;transition:opacity .1s}
    .vcap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.66rem;color:rgba(255,255,255,.65);text-shadow:0 1px 4px #000;padding:0 8px}

    .man-row{display:flex;gap:7px;flex-shrink:0}
    .man-row input{flex:1;font-size:.88rem}
    .btn-send{padding:11px 13px;background:rgba(255,50,50,.18);border:1px solid rgba(255,50,50,.35);color:#ff8888;border-radius:11px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}

    .sent-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
    .sent-ttl{font-size:.72rem;font-weight:600;color:#444;margin-bottom:5px;flex-shrink:0}
    .sent-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
    .si{display:flex;align-items:center;gap:7px;padding:6px 10px;background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.15);border-radius:9px;font-size:.72rem;font-family:monospace;color:#aaa;flex-shrink:0}
    .si .ck{color:#4ade80;font-size:.78rem}
    .se{text-align:center;color:#2a2a2a;font-size:.7rem;padding:8px 0}

    /* Toast */
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(34,197,94,.92);color:#fff;padding:8px 18px;border-radius:16px;font-size:.78rem;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
    .toast.show{opacity:1}
    .toast.err{background:rgba(239,68,68,.92)}

    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes sln{0%{transform:translateX(0)}50%{transform:translateX(calc(100vw - 4px))}100%{transform:translateX(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <div class="dot" id="dot"></div>
    <span id="sTxt">Not Connected</span>
  </div>
  <span class="brand">iFLOW SCANNER</span>
</div>

<!-- Connect Screen -->
<div class="main" id="conScr">

  <div class="card">
    <div class="card-ttl">📡 Connect to Desktop</div>
    <p class="card-hint">
      Open iFlow on your laptop, click <strong style="color:#e8eaf0">📱 Phone</strong> in any scanner.
      A 6-character code will appear — type it below.
    </p>
    <label>Desktop Connection Code</label>
    <input type="text" id="peerIn" placeholder="AB12CD" maxlength="16"
      autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false"
      style="margin-bottom:0"
      oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" />
    <div class="err-msg" id="connErr"></div>
  </div>

  <div class="card">
    <div class="card-ttl">📷 Scan Mode</div>
    <div class="mode-grid">
      <button class="mb on" id="mI" onclick="_setMode('imei_add')"><span class="ic">🔢</span>IMEI Add</button>
      <button class="mb" id="mN" onclick="_setMode('integrity')"><span class="ic">🔍</span>Integrity</button>
      <button class="mb full" id="mL" onclick="_setMode('lookup')"><span class="ic">📦</span>Product Lookup</button>
    </div>
  </div>

  <button class="btn-main" id="connBtn" onclick="_doConnect()">
    <span id="connBtnTxt">Connect to Desktop</span>
    <div class="btn-spinner" id="connSpin"><div class="spin"></div></div>
  </button>

</div>

<!-- Scanner Screen -->
<div id="scanScr">
  <div class="mode-strip">
    <div class="mbadge imei" id="modeBadge">🔢 IMEI Add</div>
    <span class="peer-lbl">Desktop: <span id="deskId"></span></span>
  </div>

  <div class="vid-wrap">
    <video id="vid" autoplay playsinline muted></video>
    <div class="v-ov">
      <div class="sln"></div>
      <div class="sfr">
        <div class="c tl"></div><div class="c tr"></div>
        <div class="c bl"></div><div class="c br"></div>
      </div>
    </div>
    <div class="flash" id="flash"></div>
    <div class="vcap" id="vcap">Initialising camera…</div>
  </div>

  <div class="man-row">
    <input type="text" id="manIn" inputmode="numeric" placeholder="Type IMEI/serial manually…"
      autocomplete="off" autocorrect="off"
      onkeydown="if(event.key==='Enter')_sendManual()" />
    <button class="btn-send" onclick="_sendManual()">Send</button>
  </div>

  <div class="sent-wrap">
    <div class="sent-ttl">Sent this session</div>
    <div class="sent-list" id="sentList"><div class="se">Nothing sent yet</div></div>
  </div>

  <button class="btn-disc" onclick="_disconnect()">✕ Disconnect</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── State ─── */
var _peer=null,_conn=null,_mode='imei_add',_reader=null,_scanning=false,_lastSent='',_cool=false,_sent=[];
var _zxingLoaded=false,_peerLoaded=false;

/* ─── Mode toggle ─── */
function _setMode(m){
  _mode=m;
  ['mI','mN','mL'].forEach(function(id,i){
    var modes=['imei_add','integrity','lookup'];
    var el=document.getElementById(id);
    if(el) el.className='mb'+(i===2?' full':'')+(m===modes[i]?' on':'');
  });
}

/* ─── Load script helper ─── */
function _loadScript(url,cb,errCb){
  var s=document.createElement('script');
  s.src=url;
  s.onload=function(){cb&&cb();};
  s.onerror=function(){errCb&&errCb();};
  document.head.appendChild(s);
}

/* ─── Connect flow ─── */
function _doConnect(){
  var id=document.getElementById('peerIn').value.trim().toLowerCase();
  if(!id){_showErr('Enter the 6-character code from your desktop.');return;}
  _showErr('');
  _setBusy(true);
  _setStatus('wait','Loading…');

  var step=0;

  function loadZXing(next){
    if(_zxingLoaded||window.ZXing){_zxingLoaded=true;next();return;}
    _setStatus('wait','Loading scanner (1/2)…');
    _loadScript(
      'https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js',
      function(){_zxingLoaded=true;next();},
      function(){
        // Fallback CDN
        _loadScript(
          'https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js',
          function(){_zxingLoaded=true;next();},
          function(){_showErr('Failed to load barcode scanner. Check internet and retry.');_setBusy(false);_setStatus('');}
        );
      }
    );
  }

  function loadPeerJS(next){
    if(_peerLoaded||window.Peer){_peerLoaded=true;next();return;}
    _setStatus('wait','Loading connection (2/2)…');
    _loadScript(
      'https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js',
      function(){_peerLoaded=true;next();},
      function(){
        _loadScript(
          'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js',
          function(){_peerLoaded=true;next();},
          function(){_showErr('Failed to load peer connection library. Check internet and retry.');_setBusy(false);_setStatus('');}
        );
      }
    );
  }

  loadZXing(function(){
    loadPeerJS(function(){
      _connectToPeer(id);
    });
  });
}

function _connectToPeer(id){
  _setStatus('wait','Connecting…');
  var btn=document.getElementById('connBtn');
  try{
    _peer=new Peer();
  }catch(e){
    _showErr('Peer init failed: '+e.message);
    _setBusy(false);_setStatus('');
    return;
  }

  var _connTimeout=setTimeout(function(){
    _showErr('Connection timed out. Check the code and make sure both devices are on the same Wi-Fi.');
    _setBusy(false);_setStatus('err');
    try{_peer&&_peer.destroy();}catch(x){}
    _peer=null;
  }, 18000);

  _peer.on('open',function(){
    clearTimeout(_connTimeout);
    try{
      _conn=_peer.connect(id,{reliable:true});
    }catch(e){
      _showErr('Could not reach desktop: '+e.message);
      _setBusy(false);_setStatus('err');
      return;
    }

    var _openTimeout=setTimeout(function(){
      _showErr('Desktop not responding. Make sure 📱 Phone is active on the laptop.');
      _setBusy(false);_setStatus('err');
    },12000);

    _conn.on('open',function(){
      clearTimeout(_openTimeout);
      _conn.send({type:'hello',mode:_mode});
      _setStatus('ok','Connected ✓');
      _showScanner(id);
    });
    _conn.on('data',function(d){
      if(d&&d.type==='mode_change'&&d.mode){_setMode(d.mode);_updateBadge();}
    });
    _conn.on('close',function(){_onDisconnect('Desktop disconnected.');});
    _conn.on('error',function(e){_showErr('Connection error: '+e);_setBusy(false);_setStatus('err');});
  });

  _peer.on('error',function(e){
    clearTimeout(_connTimeout);
    var msg='Connection failed.';
    if(e.type==='peer-unavailable') msg='Code not found — make sure laptop is showing the 📱 panel.';
    else if(e.type==='network') msg='Network error — check Wi-Fi.';
    else if(e.type==='server-error') msg='Relay server error — try again in a moment.';
    else msg='Error ('+e.type+') — retry or check internet.';
    _showErr(msg);
    _setBusy(false);_setStatus('err');
    try{_peer.destroy();}catch(x){}
    _peer=null;
  });
}

/* ─── Scanner screen ─── */
function _showScanner(deskId){
  document.getElementById('conScr').style.display='none';
  var ss=document.getElementById('scanScr');
  ss.classList.add('on');
  document.getElementById('deskId').textContent=deskId.toUpperCase();
  _updateBadge();
  _startCam();
}

function _updateBadge(){
  var b=document.getElementById('modeBadge');
  if(!b)return;
  var L={imei_add:'🔢 IMEI Add',integrity:'🔍 Integrity Scan',lookup:'📦 Product Lookup'};
  var C={imei_add:'imei',integrity:'integ',lookup:'look'};
  b.textContent=L[_mode]||_mode;
  b.className='mbadge '+(C[_mode]||'imei');
}

function _startCam(){
  if(_scanning)return;
  var vcap=document.getElementById('vcap');
  if(vcap) vcap.textContent='Requesting camera…';

  navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})
    .then(function(stream){
      var v=document.getElementById('vid');
      v.srcObject=stream;
      v.play();
      if(vcap) vcap.textContent='Point at barcode — hold steady';
      _scanning=true;
      if(!window.ZXing){if(vcap) vcap.textContent='Scanner offline — use manual entry';return;}
      try{
        _reader=new ZXing.BrowserMultiFormatReader();
        _reader.decodeFromStream(stream,document.getElementById('vid'),function(res){
          if(res){
            var val=res.getText();
            if(val&&val!==_lastSent&&!_cool){
              _cool=true;_lastSent=val;
              _doFlash();
              _sendVal(val);
              setTimeout(function(){_cool=false;_lastSent='';},2500);
            }
          }
        });
      }catch(e){
        if(vcap) vcap.textContent='Scanner error — use manual entry below';
      }
    })
    .catch(function(e){
      _scanning=false;
      var msg='Camera denied';
      if(e&&e.name==='NotFoundError') msg='No camera found';
      else if(e&&e.name==='NotAllowedError') msg='Camera permission denied — tap and allow camera, then refresh';
      else if(e&&e.name==='NotSupportedError') msg='Camera requires HTTPS — serve this file over https://';
      if(vcap) vcap.textContent=msg;
      _toast(msg,1);
    });
}

function _stopCam(){
  _scanning=false;
  if(_reader){try{_reader.reset();}catch(e){} _reader=null;}
  var v=document.getElementById('vid');
  if(v&&v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}
}

/* ─── Send ─── */
function _sendManual(){
  var v=(document.getElementById('manIn')||{}).value;
  if(!v||(v=v.trim())===''){ return;}
  _sendVal(v);
  document.getElementById('manIn').value='';
}

function _sendVal(v){
  if(!_conn||!_conn.open){_toast('Not connected',1);return;}
  try{
    _conn.send({type:'scan',mode:_mode,value:v});
    _addSent(v);
    _toast('✓ '+v.substring(0,24)+(v.length>24?'…':''));
  }catch(e){_toast('Send error: '+e.message,1);}
}

function _doFlash(){
  var f=document.getElementById('flash');
  if(!f)return;
  f.style.opacity='1';
  setTimeout(function(){f.style.opacity='0';},110);
}

function _addSent(v){
  _sent.unshift(v);
  if(_sent.length>40)_sent.pop();
  var list=document.getElementById('sentList');
  if(!list)return;
  list.innerHTML=_sent.map(function(s){
    return '<div class="si"><span class="ck">✓</span><span>'+_esc(s)+'</span></div>';
  }).join('');
}

/* ─── Disconnect ─── */
function _disconnect(){
  _stopCam();
  if(_conn){try{_conn.close();}catch(e){}} _conn=null;
  if(_peer){try{_peer.destroy();}catch(e){}} _peer=null;
  _showConnect();
}

function _onDisconnect(msg){
  _stopCam();
  _conn=null;
  _showConnect();
  _setStatus('err',msg||'Disconnected');
  _showErr(msg||'Disconnected from desktop.');
}

function _showConnect(){
  document.getElementById('conScr').style.display='';
  document.getElementById('scanScr').classList.remove('on');
  _setBusy(false);
}

/* ─── UI helpers ─── */
function _setBusy(on){
  var btn=document.getElementById('connBtn');
  var spin=document.getElementById('connSpin');
  var txt=document.getElementById('connBtnTxt');
  if(btn) btn.disabled=on;
  if(spin) spin.className='btn-spinner'+(on?' show':'');
  if(txt) txt.style.opacity=on?'0':'1';
}

function _setStatus(cls,msg){
  var dot=document.getElementById('dot');
  var txt=document.getElementById('sTxt');
  if(dot) dot.className='dot'+(cls?' '+cls:'');
  if(txt){
    txt.textContent=msg||(cls==='ok'?'Connected':cls==='wait'?'Connecting…':cls==='err'?'Error':'Not Connected');
    txt.style.color=cls==='ok'?'#22c55e':cls==='wait'?'#f59e0b':cls==='err'?'#f87171':'#555';
  }
}

function _showErr(msg){
  var el=document.getElementById('connErr');
  if(!el)return;
  if(!msg){el.className='err-msg';el.innerHTML='';return;}
  el.innerHTML=_esc(msg)+'<br><button class="btn-retry" onclick="_resetConn()">Retry</button>';
  el.className='err-msg show';
}

function _resetConn(){
  _showErr('');
  _setBusy(false);
  _setStatus('');
  if(_peer){try{_peer.destroy();}catch(e){}} _peer=null;
  if(_conn){try{_conn.close();}catch(e){}} _conn=null;
}

var _tT;
function _toast(msg,isErr){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show'+(isErr?' err':'');
  clearTimeout(_tT);
  _tT=setTimeout(function(){el.className='toast';},2800);
}

function _esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
