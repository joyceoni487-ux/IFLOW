<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iFlow — Sales Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; }
    header .logo span { color: #4f8ef7; }
    header .subtitle { font-size: 0.85rem; color: #a0aec0; margin-top: 2px; }

    .container { max-width: 860px; margin: 32px auto; padding: 0 20px; }

    /* ── Entry Card ── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      margin-bottom: 28px;
    }
    .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: #2d3748; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 540px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: #718096; }

    .field input {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #1a1a2e;
      transition: border-color .2s;
      outline: none;
      background: #fafafa;
    }
    .field input:focus { border-color: #4f8ef7; background: #fff; }
    .field input::placeholder { color: #b0bec5; font-style: italic; }

    .btn-add {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-add:hover { background: #3a7be0; }
    .btn-add:active { transform: scale(.98); }

    /* ── Summary Bar ── */
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary h2 { font-size: 1.1rem; font-weight: 600; color: #2d3748; }
    .daily-total {
      background: #ebf4ff;
      color: #2b6cb0;
      border-radius: 8px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 1rem;
    }

    /* ── Inventory subheading ── */
    .inventory-heading {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0aec0;
      margin-bottom: 10px;
    }

    /* ── Sales Table — Spreadsheet style ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      table-layout: auto;
      border: 1px solid #d0d7de;
    }
    thead th {
      background: #f0f4f8;
      padding: 9px 12px;
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #718096;
      border: 1px solid #d0d7de;
      white-space: nowrap;
    }
    tbody tr { background: #fff; }
    tbody tr:nth-child(even) { background: #fafbfc; }
    tbody td {
      border: 1px solid #d0d7de;
      padding: 0;
      vertical-align: middle;
    }
    tbody td.row-num {
      padding: 0 10px;
      color: #a0aec0;
      font-size: 0.8rem;
      text-align: center;
      background: #f7fafc;
      border-right: 1px solid #d0d7de;
      user-select: none;
      min-width: 36px;
    }
    tbody td.cell-action {
      padding: 0 8px;
      text-align: center;
      border-left: 1px solid #d0d7de;
    }
    tbody td.cell-subtotal {
      padding: 0 12px;
      font-weight: 600;
      color: #2d3748;
      white-space: nowrap;
      background: #f7fafc;
    }
    tbody td.cell-datetime {
      padding: 0 12px;
      font-size: 0.8rem;
      color: #718096;
      white-space: nowrap;
      background: #f7fafc;
    }

    /* ── Spreadsheet cell inputs ── */
    .cell-input {
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      color: #1a1a2e;
      border: none;
      border-radius: 0;
      padding: 8px 12px;
      background: transparent;
      width: 100%;
      min-width: 60px;
      outline: none;
      display: block;
    }
    .cell-input.product { font-weight: 600; }
    .cell-input[type="number"] { max-width: 100px; }

    /* Active cell — green outline like Excel */
    tbody td:focus-within {
      outline: 2px solid #21a366;
      outline-offset: -2px;
      background: #fff;
      z-index: 1;
      position: relative;
    }

    .subtotal { font-weight: 600; color: #2d3748; }
    .btn-terminate {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 7px;
      border-radius: 4px;
      transition: color .15s, background .15s;
      line-height: 1;
    }
    .btn-terminate:hover { color: #e53e3e; background: #fff5f5; }

.error-msg { color: #e53e3e; font-size: 0.82rem; margin-top: 4px; display: none; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">i<span>Flow</span></div>
    <div class="subtitle">Sales Tracker</div>
  </div>
</header>

<div class="container">

  <!-- Entry Form -->
  <div class="card">
    <h2>Record a Sale</h2>
    <div class="form-grid">

      <div class="field">
        <label for="productName">Product Name</label>
        <input id="productName" type="text"
          placeholder="e.g. Wireless Earbuds" />
      </div>

      <div class="field">
        <label for="variant">Variant</label>
        <input id="variant" type="text"
          placeholder="e.g. Black / 64GB / Pro Max" />
      </div>

      <div class="field">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="1"
          placeholder="e.g. 2" />
      </div>

      <div class="field">
        <label for="price">Price per Unit ($)</label>
        <input id="price" type="number" min="0" step="0.01"
          placeholder="e.g. 49.99" />
      </div>

    </div>
    <div id="formError" class="error-msg">Please fill in all fields with valid values.</div>
    <button class="btn-add" onclick="addSale()">+ Add Sale</button>
  </div>

  <!-- Sales Log -->
  <div class="card">
    <div class="summary">
      <h2>Today's Sales</h2>
      <div class="daily-total">Daily Total: $<span id="dailyTotal">0.00</span></div>
    </div>

    <p class="inventory-heading">Inventory</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Time</th>
            <th>Product</th>
            <th>Variant</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="salesBody">
          <tr id="emptyRow">
            <td colspan="7">
              <div class="empty-state">
                <div class="icon">🛒</div>
                No sales recorded yet. Add your first sale above.
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let sales = JSON.parse(localStorage.getItem('iflow_sales') || '[]');

  function persist() {
    localStorage.setItem('iflow_sales', JSON.stringify(sales));
  }

  function fmt(n) {
    return Number(n).toFixed(2);
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function updateTotal() {
    const total = sales.reduce((sum, s) => sum + s.quantity * s.price, 0);
    document.getElementById('dailyTotal').textContent = fmt(total);
  }

  function updateSubtotal(i) {
    const row = document.querySelector(`tr[data-index="${i}"]`);
    if (!row) return;
    const sub = sales[i].quantity * sales[i].price;
    row.querySelector('.cell-subtotal').textContent = '$' + fmt(sub);
    updateTotal();
  }

  function render() {
    const body = document.getElementById('salesBody');
    body.innerHTML = '';

    // Always render at least 5 blank rows so the grid never looks empty
    const rows = sales.length > 0 ? sales : [];
    const minRows = 5;
    const totalRows = Math.max(rows.length, minRows);

    for (let i = 0; i < totalRows; i++) {
      const s = sales[i];
      const sub = s ? s.quantity * s.price : null;
      const tr = document.createElement('tr');
      tr.dataset.index = i;
      tr.innerHTML = `
        <td class="row-num">${i + 1}</td>
        <td class="cell-datetime">${s ? fmtDate(s.timestamp) : ''}</td>
        <td class="cell-datetime">${s ? fmtTime(s.timestamp) : ''}</td>
        <td><input class="cell-input product" value="${s ? escAttr(s.product) : ''}" placeholder="" data-field="product" data-index="${i}" /></td>
        <td><input class="cell-input" value="${s ? escAttr(s.variant) : ''}" placeholder="" data-field="variant" data-index="${i}" /></td>
        <td><input class="cell-input" type="number" min="1" value="${s ? s.quantity : ''}" placeholder="" data-field="quantity" data-index="${i}" /></td>
        <td><input class="cell-input" type="number" min="0" step="0.01" value="${s ? s.price : ''}" placeholder="" data-field="price" data-index="${i}" /></td>
        <td class="cell-subtotal">${sub !== null ? '$' + fmt(sub) : ''}</td>
        <td class="cell-action"><button class="btn-terminate" onclick="terminateRow(${i})" title="Clear row">&#9632;</button></td>
      `;
      body.appendChild(tr);
    }

    updateTotal();
  }

  // Delegate all cell-input changes
  document.getElementById('salesBody').addEventListener('input', e => {
    const inp = e.target;
    if (!inp.classList.contains('cell-input')) return;
    const i = parseInt(inp.dataset.index);
    const field = inp.dataset.field;
    let val = inp.value;

    // If typing into a blank row, stamp timestamp and show date/time immediately
    if (!sales[i]) {
      const ts = Date.now();
      sales[i] = { product: '', variant: '', quantity: 1, price: 0, timestamp: ts };
      const row = document.querySelector(`tr[data-index="${i}"]`);
      if (row) {
        row.querySelectorAll('.cell-datetime')[0].textContent = fmtDate(ts);
        row.querySelectorAll('.cell-datetime')[1].textContent = fmtTime(ts);
      }
    }

    if (field === 'quantity') { val = Math.max(1, parseFloat(val) || 1); }
    if (field === 'price')    { val = Math.max(0, parseFloat(val) || 0); }
    sales[i][field] = (field === 'quantity' || field === 'price') ? +val : val;
    persist();
    updateSubtotal(i);

    // Add a new blank row if the last row now has data
    const tbody = document.getElementById('salesBody');
    const lastRow = tbody.lastElementChild;
    const lastIndex = parseInt(lastRow.dataset.index);
    if (lastIndex < sales.length) {
      const minRows = 5;
      if (tbody.children.length <= sales.length || tbody.children.length < minRows) {
        render();
      }
    }
  });

  function addSale() {
    const product  = document.getElementById('productName').value.trim();
    const variant  = document.getElementById('variant').value.trim();
    const quantity = parseFloat(document.getElementById('quantity').value);
    const price    = parseFloat(document.getElementById('price').value);
    const errEl    = document.getElementById('formError');

    if (!product || isNaN(quantity) || quantity <= 0 || isNaN(price) || price < 0) {
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    sales.push({ product, variant, quantity, price, timestamp: Date.now() });
    persist();
    render();

    ['productName', 'variant', 'quantity', 'price'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('productName').focus();
  }

  function terminateRow(index) {
    if (sales[index]) {
      sales.splice(index, 1);
      persist();
    }
    render();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escAttr(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && ['productName','variant','quantity','price'].includes(e.target.id)) {
      addSale();
    }
  });

  render();
</script>
</body>
</html>
